<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#0f1226;--panel:#1b2040;--ink:#f3efe2;--dim:#8f9bc9;--amber:#ffb84d;--jar:#2a3163;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9e4f5;--panel:#fff;--ink:#1c1f3d;--dim:#5a6397;--jar:#cfd3f0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:460px;display:flex;flex-direction:column;padding:12px 14px 18px;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.pill{background:var(--panel);padding:6px 12px;border-radius:99px;font-size:15px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--amber);color:#2a1a00;font-weight:600;padding:10px 18px;border-radius:14px;font-size:16px}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn:focus-visible,.jar:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.track{position:relative;height:92px;background:linear-gradient(var(--panel),transparent);border-radius:18px;margin-top:2px}
.road{position:absolute;left:36px;right:44px;bottom:16px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--dim) 0 8px,transparent 8px 16px);opacity:.6}
.stop{position:absolute;bottom:10px;width:16px;height:16px;border-radius:50%;background:var(--jar);border:2px solid var(--dim)}
.stop.done{background:var(--amber);border-color:var(--amber);box-shadow:0 0 12px var(--amber)}
.chestIcon{position:absolute;right:8px;bottom:8px;font-size:30px}
#hero{position:absolute;bottom:14px;width:44px;height:64px;transition:left .9s ease-in-out;margin-left:-14px}
#pet{position:absolute;bottom:12px;width:44px;height:36px;transition:left .9s ease-in-out;margin-left:-14px}
#hero.walk{animation:bob .3s infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;align-content:center;padding:6px 4px}
.jar{height:150px;margin:0 auto;width:56px;background:var(--jar);border-radius:10px 10px 26px 26px;display:flex;flex-direction:column-reverse;align-items:center;padding:8px 0 6px;gap:3px;transition:transform .15s;position:relative}
.jar::before{content:"";position:absolute;top:-6px;width:36px;height:8px;border-radius:6px;background:var(--dim)}
.jar.sel{transform:translateY(-14px);box-shadow:0 0 18px var(--amber)}
.f{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:0 0 12px currentColor;background:currentColor;animation:glow 2.4s infinite alternate}
@keyframes glow{to{filter:brightness(1.25)}}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.row .btn{padding:9px 12px;font-size:14px}.it small{color:var(--dim)}#boss{display:none;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:8px 12px}#bm{font-size:40px}#bm.hit{animation:hit .35s}@keyframes hit{25%{transform:translateX(-6px) rotate(-8deg)}75%{transform:translateX(6px) rotate(8deg)}}.hp{height:10px;border-radius:6px;background:var(--jar);margin-top:4px;overflow:hidden}.hp i{display:block;height:100%;background:#ff4d6d;transition:width .3s}#boss small{color:var(--amber);margin-left:6px}#hero svg{overflow:visible}.sw{transform-box:view-box;transform-origin:0 0}#hero.swing .sw{animation:swing .38s}@keyframes swing{0%{transform:rotate(0)}45%{transform:rotate(85deg)}100%{transform:rotate(0)}}#pet.lunge{animation:lunge .3s}@keyframes lunge{50%{transform:translateX(14px) scale(1.1)}}#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}#rain i{position:absolute;top:-20px;width:2px;height:16px;background:linear-gradient(transparent,#8ecbff);opacity:.7;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh)}}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}#hero svg{animation:idle 2.6s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-1.5px)}}.jar.hint{box-shadow:0 0 0 3px #6bcb77}
.ov{position:fixed;inset:0;background:rgba(8,10,25,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.ov.on{display:flex}
.card{max-height:92vh;overflow:auto;background:var(--panel);border-radius:22px;padding:22px;width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h2{margin:0;font-size:24px}.card p{margin:0;color:var(--dim)}
.chest{font-size:80px;cursor:pointer;animation:shake 1s infinite}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.it{background:var(--jar);padding:10px 4px;border-radius:12px;font-size:14px}
.it.on{outline:3px solid var(--amber)}.it.lock{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="ov" id="ov"><div class="card" id="card"></div></div>

 const body=g?`<rect x="15" y="50" width="5" height="10" rx="2.5" fill="#f2c9a0"/><rect x="24" y="50" width="5" height="10" rx="2.5" fill="#f2c9a0"/><path d="M16 27 H28 L35 51 H9Z" fill="${s.c}"/><path d="M17 27 H27 L22 32Z" fill="#fff" opacity=".6"/><rect x="15" y="37" width="14" height="2" fill="#fff" opacity=".35"/>${ep?'<circle cx="15" cy="44" r="1.3" fill="#fff"/><circle cx="27" cy="41" r="1.3" fill="#fff"/><circle cx="21" cy="47" r="1.3" fill="#fff"/>':''}`:`<rect x="14" y="48" width="6" height="12" rx="3" fill="#3d405b"/><rect x="24" y="48" width="6" height="12" rx="3" fill="#3d405b"/><rect x="12" y="26" width="20" height="23" rx="5" fill="${s.c}"/><path d="M16 26 L22 34 L28 26Z" fill="#fff"/><circle cx="22" cy="40" r="1" fill="#fff" opacity=".7"/><circle cx="22" cy="45" r="1" fill="#fff" opacity=".7"/>${s.r!=='common'?'<path d="M22 33 L17 30 V36Z M22 33 L27 30 V36Z" fill="#e63946"/>':''}`;
 const hat=!h.c?'':h.id==='h3'?`<path d="M11 11 L14 2 L18 8 L22 1 L26 8 L30 2 L33 11Z" fill="${h.c}"/>`:h.id==='h4'?`<path d="M27 8 L34 4 V12Z M27 8 L20 4 V12Z" fill="${h.c}"/><circle cx="27" cy="8" r="2" fill="${h.c}"/>`:`<path d="M11 14 Q22 -2 33 14Z" fill="${h.c}"/>`;
 return `<svg viewBox="0 0 44 64" width="44" height="64"><circle cx="38" cy="40" r="12" fill="#ffb84d" opacity=".25"/>${g?`<path d="M10 14 Q10 32 14 32 H30 Q34 32 34 14Z" fill="${hr}"/>`:''}${body}<circle cx="22" cy="17" r="10" fill="#f2c9a0"/><path d="M12 15 Q12 5 22 6 Q32 5 32 15 Q27 10 22 11 Q17 10 12 15Z" fill="${hr}"/><circle cx="18" cy="18" r="2" fill="#2b2d42"/><circle cx="26" cy="18" r="2" fill="#2b2d42"/><circle cx="18.7" cy="17.2" r=".7" fill="#fff"/><circle cx="26.7" cy="17.2" r=".7" fill="#fff"/><circle cx="15" cy="21.5" r="1.8" fill="#ff9aa2" opacity=".6"/><circle cx="29" cy="21.5" r="1.8" fill="#ff9aa2" opacity=".6"/><path d="M19 22 Q22 25 25 22" stroke="#9c4a3c" stroke-width="1.3" fill="none" stroke-linecap="round"/>${hat}<rect x="34" y="34" width="8" height="12" rx="3" fill="#ffb84d"/></svg>`}
function setG(g){S.gender=g;const d=g==='girl'?'d0':'b0';S.own[d]=1;const e=item(S.eq.shirt);if(!e||e.g!==g)S.eq.shirt=d;const hh=item(S.eq.hat);if(hh.g&&hh.g!==g)S.eq.hat='h0';save();pos()}
function pick(){show(`<h2>Who is walking?</h2><p>Choose your character. You can change it later.</p><div class="row"><button class="btn" id="pg">Girl</button><button class="btn" id="pb">Boy</button></div>`);$('pg').onclick=()=>{setG('girl');hide()};$('pb').onclick=()=>{setG('boy');hide()}}
function heroOld(){const h=item(S.eq.hat),s=item(S.eq.shirt);
 return `<svg viewBox="0 0 44 64" width="44" height="64"><circle cx="38" cy="40" r="12" fill="#ffb84d" opacity=".25"/><rect x="12" y="26" width="20" height="22" rx="7" fill="${s.c}"/><circle cx="22" cy="17" r="10" fill="#f2c9a0"/>${h.c?(h.id==='h3'?`<path d="M11 11 L14 2 L18 8 L22 1 L26 8 L30 2 L33 11Z" fill="${h.c}"/>`:`<path d="M11 14 Q22 -2 33 14Z" fill="${h.c}"/>`):''}<rect x="14" y="48" width="6" height="12" rx="3" fill="#3d405b"/><rect x="24" y="48" width="6" height="12" rx="3" fill="#3d405b"/><rect x="34" y="34" width="8" height="12" rx="3" fill="#ffb84d"/></svg>`}
function pos(){const p=(S.lvl-1)%3;$('hero').style.left=`calc(36px + (100% - 80px) * ${p/3})`;
 $('track').querySelectorAll('.stop').forEach(e=>e.remove());
 for(let i=0;i<3;i++){const d=document.createElement('div');d.className='stop'+(i<=p?' done':'');d.style.left=`calc(36px + (100% - 80px) * ${i/3} - 6px)`;$('track').appendChild(d)}
 $('hero').innerHTML=heroSVG();petPos();rain()}
function solve(js){const key=j=>j.map(x=>x.join('')).join('|'),hh=j=>j.reduce((a,x)=>{if(!x.length)return a;let r=1;while(r<x.length&&x[r]===x[0])r++;return a+x.length-r+(x.length<CAP?1:0)},0);
 const open=[[hh(js)*2,0,js,null]],seen=new Set([key(js)]);let n=0;
 while(open.length&&n++<2500){if(open.length>4000){open.sort((x,y)=>x[0]-y[0]);open.length=2000}let bi=0;for(let i=1;i<open.length;i++)if(open[i][0]<open[bi][0])bi=i;const [f,g,cur,m0]=open.splice(bi,1)[0];
  if(cur.every(x=>!x.length||(x.length===CAP&&x.every(y=>y===x[0]))))return {g,m:m0};
  for(let a=0;a<cur.length;a++){if(!cur[a].length)continue;const c=cur[a][cur[a].length-1];
   for(let b=0;b<cur.length;b++){if(a===b||cur[b].length>=CAP)continue;if(cur[b].length?cur[b][cur[b].length-1]!==c:cur[a].length===1)continue;
    const nx=cur.map(x=>x.slice());nx[b].push(nx[a].pop());const k=key(nx);if(seen.has(k))continue;seen.add(k);open.push([g+1+hh(nx)*2,g+1,nx,m0||[a,b]])}}}
 return null}
const solved=()=>jars.every(j=>!j.length||(j.length===CAP&&j.every(x=>x===j[0])));
function build(){
 const n=Math.min(3+Math.floor((S.lvl-1)/2),10);let K,tries=0;
 do{
  jars=[];for(let c=0;c<n;c++)jars.push(Array(CAP).fill(c));jars.push([]);if(S.lvl<15)jars.push([]);
  K=Math.min(10+Math.round(S.lvl*1.6),60);let last=null,done=0,guard=0;
  while(done<K&&guard++<3000){
   const from=Math.floor(Math.random()*jars.length),A=jars[from];
   if(!A.length)continue;const c=A[A.length-1];
   if(A.length>1&&A[A.length-2]!==c)continue;
   const to=Math.floor(Math.random()*jars.length);
   if(to===from||jars[to].length>=CAP||(last&&last[0]===to&&last[1]===from))continue;
   jars[to].push(A.pop());last=[from,to];done++}
 }while(solved()&&++tries<20);
 const slack=Math.ceil(K*Math.max(.25,.6-S.lvl*.004))+3;
 const isB=S.lvl%5===0;boss=isB?{hp:n*7,max:n*7,n:n,i:(S.lvl/5-1)%7,hit:0,msg:''}:null;mv=0;const sr=solve(jars),sl=sr?sr.g:0;left=startLeft=sl?Math.max(sl+(S.hard?1:2),Math.ceil(sl*(1+(S.lvl<=10?.6:S.lvl<=30?.5:.4))*(S.hard?.8:1))):K+slack;start=JSON.stringify(jars);over=false;sel=-1;hist=[];render();pos()}
function render(){
 $('lv').textContent=S.lvl<=1000?'Level '+S.lvl+'/1000':'Level '+S.lvl;$('coins').textContent=S.coins;$('mv').textContent=left;bossUI();
 const b=$('board');b.innerHTML='';
 jars.forEach((j,i)=>{const d=document.createElement('button');d.className='jar'+(i===sel?' sel':'')+(sel>=0&&sel===hintFrom&&i===hintTo?' hint':'');d.setAttribute('aria-label','Jar '+(i+1));
  j.forEach((c,ix)=>{const f=document.createElement('div');f.className='f';if(false){f.textContent='?';f.style.cssText='animation:none;box-shadow:none;background:#4a5180;color:#cfd3f0;display:flex;align-items:center;justify-content:center;font-size:14px'}else f.style.color=COL[c];d.appendChild(f)});
  d.onclick=()=>tap(i);b.appendChild(d)})}
function tap(i){
 if(sel<0){if(jars[i].length)sel=i;render();return}
 if(sel===i){sel=-1;render();return}
 const a=jars[sel],b=jars[i];
 if(!a.length){sel=-1;render();return}
 const c=a[a.length-1];
 if(b.length&&b[b.length-1]!==c){sel=jars[i].length?i:-1;render();return}
 if(b.length<CAP&&!over){hist.push([JSON.stringify(jars),left,boss?boss.hp:0]);b.push(a.pop());left--;mv++;hitBoss(b,c);if(b.length===CAP&&b.every(x=>x===c))qp('j',1);fx(i);snd(300+b.length*110);if(navigator.vibrate)navigator.vibrate(12)}
 sel=-1;render();
 if(solved()||(boss&&boss.hp<=0)){over=true;setTimeout(win,350)}else if(left<=0){over=true;setTimeout(lose,350)}}
function show(html){$('card').innerHTML=html;$('ov').classList.add('on')}
function hide(){$('ov').classList.remove('on')}
function win(){snd(784,.3);
 const st=left>=Math.ceil(startLeft*.15)?3:left>=Math.ceil(startLeft*.05)?2:1,pb=S.pets[S.pet]?PB[S.pets[S.pet].t]:0,gain=Math.round((10+st*5)*(1+pb)*(S.hard?1.5:1));S.coins+=gain;qp('l',1);if(boss)qp('b',1);const chest=S.lvl%3===0||!!boss;
 if(chest){show(`<h2>${boss?'Boss defeated!':'Chest found!'}</h2><p>You reached the end of the path.</p><div class="chest" id="ch" role="button" tabindex="0">🎁</div><p>Tap the chest</p>`);
  $('ch').onclick=openChest}
 else{show(`<h2>Level ${S.lvl} clear!</h2><p>+${gain} 🪙${pb?' (pet bonus +'+Math.round(pb*100)+'%)':''}</p><div style='font-size:34px;color:#ffb84d'>${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>Your lantern lights the way.</p><button class="btn" id="nx">Walk on</button>`);$('nx').onclick=next}
 save()}
function next(){if(S.lvl===1000&&!S.fin){S.fin=1;save();show(`<h2>Champion!</h2><p>You cleared all 1000 levels.</p><div style='font-size:70px'>🏆</div><button class='btn' id='ct'>Keep playing</button>`);$('ct').onclick=next;return}
 if(S.lvl%10===0&&!eggDone&&(S.em>=2||Math.random()<.4)){S.em=0;return egg()}if(S.lvl%10===0&&!eggDone)S.em=(S.em||0)+1;eggDone=false;hide();S.lvl++;save();$('hero').classList.add('walk');pos();setTimeout(()=>{$('hero').classList.remove('walk');build()},950)}
function openChest(){
 const base=boss?60:20,locked=ITEMS.filter(i=>!S.own[i.id]&&i.r!=='legendary'&&(!i.g||i.g===S.gender));let got=null;
 if(locked.length&&Math.random()<.7){const w=locked.map(i=>i.r==='common'?6:i.r==='rare'?3:1);let t=Math.random()*w.reduce((a,b)=>a+b),k=0;for(;k<locked.length-1&&(t-=w[k])>0;k++);got=locked[k];S.own[got.id]=1}
 S.coins+=base;save();
 show(`<h2>${got?'New item: '+got.name:'+'+base+' coins'}</h2><p>${got?got.r+' item added to your wardrobe':'Chest reward'}</p><div style="font-size:64px">${got?'✨':'🪙'}</div><button class="btn" id="dbl">Watch ad: double coins (demo)</button><button class="btn alt" id="ct">Continue</button>`);
 $('dbl').onclick=()=>{S.coins+=base;save();$('dbl').remove();$('ct').textContent='Doubled! Continue'};
 $('ct').onclick=next}
function lose(){show(`<h2>Out of moves</h2><p>So close. Try again, or get 5 more moves.</p><button class="btn" id="mo">Watch ad: +5 moves (demo)</button><button class="btn alt" id="rt">Restart level</button>`);$('mo').onclick=()=>{hide();left+=5;over=false;render()};$('rt').onclick=()=>$('reset').click()}
function wardrobe(){
 const g=slot=>ITEMS.filter(i=>i.slot===slot&&(!i.g||i.g===S.gender)).map(i=>`<button class="it ${S.own[i.id]?'':'lock'} ${S.eq[slot]===i.id?'on':''}" data-id="${i.id}">${S.own[i.id]?i.name:'🔒 '+i.r}</button>`).join('');
 show(`<h2>Dress up</h2><div class="row"><button class="btn ${S.gender==='girl'?'':'alt'}" data-g="girl">Girl</button><button class="btn ${S.gender==='boy'?'':'alt'}" data-g="boy">Boy</button></div><div>${heroSVG().replace('width="44" height="64"','width="88" height="128"')}</div><p>Hats</p><div class="grid">${g('hat')}</div><p>${S.gender==='girl'?'Dresses':'Shirts'}</p><div class="grid">${g('shirt')}</div><p>Hand</p><div class="grid">${g('hand')}</div>${S.pets.length?`<p>Pets ${new Set(S.pets.map(p=>p.t)).size}/11 found</p><div class="grid">${S.pets.map((p,i)=>`<button class="it ${S.pet===i?'on':''}" data-p="${i}">${petSVG(p)}</button>`).join('')}</div>`:''}<button class="btn" id="cl">Done</button>`);
 $('card').querySelectorAll('.it').forEach(b=>b.onclick=()=>{const i=item(b.dataset.id);if(S.own[i.id]){S.eq[i.slot]=i.id;save();pos();wardrobe()}});
 $('card').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{setG(b.dataset.g);wardrobe()});$('card').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.pet=+b.dataset.p;save();pos();wardrobe()});$('cl').onclick=hide}
$('undo').onclick=()=>{if(hist.length&&!over){const h=hist.pop();jars=JSON.parse(h[0]);if(boss)boss.hp=h[2];sel=-1;render()}};
$('reset').onclick=()=>{hide();jars=JSON.parse(start);left=startLeft;if(boss)boss.hp=boss.max;mv=0;sel=-1;hist=[];over=false;render()};
$('plus').onclick=()=>{if(S.inv.moves>0){S.inv.moves--;save()}left+=5;over=false;render()};
$('wardrobe').onclick=wardrobe;$('shopb').onclick=shop;
$('hintb').onclick=hint;$('menub').onclick=menu;applyTheme();build();if(!S.gender)pick();else daily();
</script></body></html>
